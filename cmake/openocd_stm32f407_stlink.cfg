# STM32F407 (Discovery ST-Link/V2-1). Paths are OpenOCD install scripts/.
# Usage: openocd -f /path/to/bdk/cmake/openocd_stm32f407_stlink.cfg

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f4x.cfg]

# GDB default port
gdb_port 3333
tcl_port 6666
telnet_port 4444

# Reset: connect under reset, then release (reliable on Discovery)
reset_config srst_only srst_nogate connect_assert_srst
